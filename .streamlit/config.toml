[server]
# Same security settings as the Cloud Run image (Dockerfile.dashboard), so local
# runs test what ships. Streamlit needs CORS protection on when XSRF protection is.
enableXsrfProtection = true
enableCORS = true
# Serves dashboard/static/ at /app/static/, for the self-hosted images.
enableStaticServing = true

[browser]
# Tell the Streamlit runtime what the public-facing URL is so it builds
# correct absolute paths for component assets (folium iframe src, etc.).
# Leave blank to let Streamlit auto-detect (safe for most deployments).
serverAddress = ""

[theme]
base = "light"
