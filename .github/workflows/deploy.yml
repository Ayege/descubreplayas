# ── Deploy to GCP Cloud Run — GitHub Actions ──────────────────────────────────
# Triggered on pushes to main. Runs the CI checks first, then builds API + Dashboard
# images in PARALLEL and deploys each to Cloud Run using the gcloud CLI directly (avoids
# the Node 20 deprecation warning emitted by google-github-actions/deploy-cloudrun).
# A new revision gets traffic only after it passes a smoke check. Manual runs deploy
# only from main.
#
# Required GitHub Secrets  (Settings → Secrets and variables → Actions),
# read directly via ${{ secrets.X }} below:
#   GCP_PROJECT_ID        — your GCP project id, e.g. sargapp-123456
#   GCP_REGION            — Cloud Run region, e.g. us-east1
#   GCP_SA_KEY            — JSON key of the deploy service account (see gcp-setup.sh)
#   API_BASE_URL          — public URL of the API, e.g. https://api.descubreplayas.com.do
#   APP_CANONICAL_URL     — canonical URL of the dashboard, e.g. https://descubreplayas.com.do
#   GA_MEASUREMENT_ID     — Google Analytics 4 measurement ID (optional)
#
# The following are NOT GitHub secrets — they're pulled at deploy time from
# GCP Secret Manager (see deploy/gcp-setup.sh) via --update-secrets below, so
# they never touch GitHub or CI logs:
#   sargapp-supabase-url, sargapp-supabase-key, sargapp-telegram-bot-token,
#   sargapp-telegram-webhook-secret
#
# The pipeline cron (pipeline.yml) is NOT changed here.

name: deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "dashboard/**"
      - "pipeline/**"
      - "static/**"
      - "Dockerfile.*"
      - "docker-entrypoint-dashboard.sh"
      - "requirements/*.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Same checks as pull requests; nothing deploys unless they pass ──────────
  test:
    uses: ./.github/workflows/ci.yml

  # ── Detect which services actually changed ──────────────────────────────────
  # Skips the API job when only dashboard/ changed, and vice-versa, so a
  # dashboard-only tweak doesn't rebuild + redeploy the API unnecessarily.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api:       ${{ steps.diff.outputs.api }}
      dashboard: ${{ steps.diff.outputs.dashboard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # a push can hold several commits

      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A manual run, a first push or an unknown base deploys both.
          if [[ "$EVENT_NAME" != "push" ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "api=true"       >> "$GITHUB_OUTPUT"
            echo "dashboard=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" HEAD)
          if echo "$CHANGED" | grep -qE '^(api/|pipeline/|Dockerfile\.api|requirements/api\.lock)'; then
            echo "api=true"  >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(dashboard/|static/|Dockerfile\.dashboard|docker-entrypoint-dashboard\.sh|requirements/dashboard\.lock)'; then
            echo "dashboard=true"  >> "$GITHUB_OUTPUT"
          else
            echo "dashboard=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build + deploy API ──────────────────────────────────────────────────────
  deploy-api:
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sargapprepo/sargapp-api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      # Pull the previous :latest so Docker can reuse unchanged layers.
      - name: Warm Docker layer cache
        run: docker pull "${{ env.IMAGE }}:latest" || true

      - name: Build API image
        run: |
          docker build \
            --cache-from "${{ env.IMAGE }}:latest" \
            -f Dockerfile.api \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            -t "${{ env.IMAGE }}:latest" \
            .

      - name: Push API image
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      # Use gcloud directly — identical to what deploy-cloudrun@v2 runs
      # internally, but without the Node 20 deprecation warning.
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy sargapp-api \
            --image     "${{ env.IMAGE }}:${{ github.sha }}" \
            --region    "${{ secrets.GCP_REGION }}" \
            --port      8000 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --memory    512Mi \
            --cpu       1 \
            --update-env-vars    "API_BASE_URL=${{ secrets.API_BASE_URL }}" \
            --update-secrets     "SUPABASE_URL=sargapp-supabase-url:latest,SUPABASE_KEY=sargapp-supabase-key:latest,TELEGRAM_BOT_TOKEN=sargapp-telegram-bot-token:latest,TELEGRAM_WEBHOOK_SECRET=sargapp-telegram-webhook-secret:latest" \
            --update-labels      "managed-by=github-actions,commit-sha=${{ github.sha }}" \
            --no-traffic \
            --tag candidate

      # The new revision has no traffic yet. If a check fails, visitors stay on the old one.
      - name: Check the new revision
        run: |
          URL=$(gcloud run services describe sargapp-api --region "${{ secrets.GCP_REGION }}" --format=json \
                | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          curl --fail --silent --show-error --output /dev/null --max-time 60 --retry 5 --retry-delay 10 --retry-all-errors "$URL/health"

      - name: Send traffic to the new revision
        run: |
          gcloud run services update-traffic sargapp-api --region "${{ secrets.GCP_REGION }}" \
            --to-latest --remove-tags candidate

  # ── Build + deploy Dashboard ────────────────────────────────────────────────
  deploy-dashboard:
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: us-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/sargapprepo/sargapp-dashboard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Warm Docker layer cache
        run: docker pull "${{ env.IMAGE }}:latest" || true

      - name: Build Dashboard image
        run: |
          docker build \
            --cache-from "${{ env.IMAGE }}:latest" \
            -f Dockerfile.dashboard \
            -t "${{ env.IMAGE }}:${{ github.sha }}" \
            -t "${{ env.IMAGE }}:latest" \
            .

      - name: Push Dashboard image
        run: |
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker push "${{ env.IMAGE }}:latest"

      - name: Deploy Dashboard to Cloud Run
        run: |
          gcloud run deploy sargapp-dashboard \
            --image     "${{ env.IMAGE }}:${{ github.sha }}" \
            --region    "${{ secrets.GCP_REGION }}" \
            --port      8501 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory    1Gi \
            --cpu       1 \
            --update-env-vars  "API_BASE_URL=https://api.descubreplayas.com.do,APP_CANONICAL_URL=${{ secrets.APP_CANONICAL_URL }},GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}" \
            --update-secrets   "SUPABASE_URL=sargapp-supabase-url:latest,SUPABASE_KEY=sargapp-supabase-key:latest" \
            --update-labels    "managed-by=github-actions,commit-sha=${{ github.sha }}" \
            --no-traffic \
            --tag candidate

      # The new revision has no traffic yet. If a check fails, visitors stay on the old one.
      - name: Check the new revision
        run: |
          URL=$(gcloud run services describe sargapp-dashboard --region "${{ secrets.GCP_REGION }}" --format=json \
                | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          curl --fail --silent --show-error --output /dev/null --max-time 60 --retry 5 --retry-delay 10 --retry-all-errors "$URL/_stcore/health"
          curl --fail --silent --show-error --output /dev/null --max-time 60 --retry 5 --retry-delay 10 --retry-all-errors "$URL/app/static/beaches/.gitkeep"

      - name: Send traffic to the new revision
        run: |
          gcloud run services update-traffic sargapp-dashboard --region "${{ secrets.GCP_REGION }}" \
            --to-latest --remove-tags candidate

  # ── Summary (always runs, and fails if anything before it failed) ───────────
  summary:
    needs: [test, changes, deploy-api, deploy-dashboard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deployment summary
        env:
          TEST: ${{ needs.test.result }}
          CHANGES: ${{ needs.changes.result }}
          API: ${{ needs.deploy-api.result }}
          DASHBOARD: ${{ needs.deploy-dashboard.result }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### Deployment results"
            echo "- **Tests**: $TEST"
            echo "- **API**: $API (https://api.descubreplayas.com.do)"
            echo "- **Dashboard**: $DASHBOARD (https://descubreplayas.com.do)"
            echo "- **Commit**: \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$TEST" "$CHANGES" "$API" "$DASHBOARD"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              exit 1
            fi
          done
