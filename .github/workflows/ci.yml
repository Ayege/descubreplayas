# Runs before merge, and before every deploy (deploy.yml calls this workflow).
# Only offline suites run here: test_store, test_detect and test_ocean use live services.

name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/pipeline.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements/pipeline.lock

      - name: Run offline test suites
        run: |
          for suite in afai beaches conoce dispatch drift evaluate images map_perf profiles reports risk_overlay surf workflows; do
            echo "::group::test_$suite"
            python -m "tests.test_$suite"
            echo "::endgroup::"
          done

  # Anything importing scripts/_images.py needs Pillow 13, which can't share an
  # environment with Streamlit 1.58. See requirements/README.md.
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ingest.lock

      - name: Install the ingest lockfile
        run: pip install --require-hashes -r requirements/ingest.lock

      - name: Run ingest test suites
        run: |
          for suite in fetch_species image_pipeline beach_photos review_photos; do
            echo "::group::test_$suite"
            python -m "tests.test_$suite"
            echo "::endgroup::"
          done

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/ci-tools.lock

      - name: Install scanners
        run: |
          python -m venv .tools
          .tools/bin/pip install --require-hashes -r requirements/ci-tools.lock

      - name: Lint for real errors across the repo
        run: .tools/bin/ruff check --select E9,F63,F7,F82 api dashboard pipeline scripts tests

      - name: Lint the Conoce code strictly
        run: >-
          .tools/bin/ruff check --select E9,F,B,S --ignore S101
          dashboard/conoce.py dashboard/conoce_data.py dashboard/map_perf.py scripts/_http.py scripts/_images.py scripts/fetch_species.py
          scripts/_commons.py scripts/_beach_match.py scripts/beach_photo_candidates.py scripts/import_beach_photo.py scripts/review_photos.py

      - name: Static security analysis
        run: .tools/bin/bandit -q -ll -r api dashboard pipeline scripts

      - name: Audit dependencies
        run: |
          ignored=$(grep -vE '^(#|$)' requirements/audit-ignore.txt | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          for lock in api dashboard ingest pipeline; do
            .tools/bin/pip-audit --require-hashes --disable-pip $ignored -r "requirements/$lock.lock"
          done

      - name: Scan git history for secrets
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
