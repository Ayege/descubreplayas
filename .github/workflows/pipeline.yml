# Scheduled pipeline run — detect, drift, store, dispatch every 6 hours.
# Secrets required in repo Settings > Secrets and variables > Actions:
#   EE_PROJECT, EE_SERVICE_ACCOUNT_JSON (the full JSON string, not a path),
#   CMEMS_USERNAME, CMEMS_PASSWORD,
#   SUPABASE_URL, SUPABASE_KEY,
#   TELEGRAM_BOT_TOKEN, API_BASE_URL

name: pipeline

on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00 06:00 12:00 18:00 UTC every day
  workflow_dispatch:          # also triggerable manually from the Actions tab

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EE_PROJECT:               ${{ secrets.EE_PROJECT }}
      EE_SERVICE_ACCOUNT_JSON:  ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
      CMEMS_USERNAME:           ${{ secrets.CMEMS_USERNAME }}
      CMEMS_PASSWORD:           ${{ secrets.CMEMS_PASSWORD }}
      SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY:             ${{ secrets.SUPABASE_KEY }}
      TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
      API_BASE_URL:             ${{ secrets.API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/pipeline.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements/pipeline.lock

      - name: Authenticate Earth Engine (service account)
        # The EE_SERVICE_ACCOUNT_JSON secret must contain the raw JSON of the
        # service-account key file.  We write it to a temp file and point the
        # EE SDK at it via the standard application-default-credentials env var.
        run: |
          echo "$EE_SERVICE_ACCOUNT_JSON" > /tmp/ee_key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/ee_key.json" >> "$GITHUB_ENV"

      # Keep the trained extended-forecast model and the run counter between
      # scheduled runs, so ML_RETRAIN_EVERY_N_RUNS applies instead of a full
      # retrain every 6 hours. Each run saves under a new key; restore picks
      # the newest. Caches written on main can't be written by pull requests.
      - name: Restore model cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pipeline/.model_cache.pkl
            pipeline/.run_count
          key: ml-model-${{ github.run_id }}
          restore-keys: ml-model-

      - name: Run pipeline
        run: python -m pipeline.run

      - name: Save model cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pipeline/.model_cache.pkl
            pipeline/.run_count
          key: ml-model-${{ github.run_id }}
